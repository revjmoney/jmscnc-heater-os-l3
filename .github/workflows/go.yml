name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23'
          check-latest: true
      - name: go vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: go test
        run: go test ./...
        env:
          CGO_ENABLED: '0'
      - name: cross-build ARM firmware binary
        run: go build -trimpath -ldflags='-s -w' -o /tmp/l3lab-arm .
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
